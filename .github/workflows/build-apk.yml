
name: Build DJ HOOSHANG V3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find project
        run: |
          PROJECT_DIR=$(find . -name settings.gradle -not -path '*/.gradle/*' -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -name 'DJ_HOOSHANG_V3_Source.zip' | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p extracted
              unzip -q "$ZIP_FILE" -d extracted
              PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at $PROJECT_DIR"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-HOOSHANG-V3-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
